name: Publish to GitHub Packages

on:
  push:
    tags:
      - 'v*' # Trigger on tags matching v*, i.e. v1.0.0, v20.15.10

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create release and upload release assets
      packages: write # Required to publish to GitHub Packages

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10 # 与本地锁文件生成环境 (pnpm 10) 保持一致

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24' # 与本地开发环境 (Node 24.19.0 LTS) 保持一致
          cache: 'pnpm'
          registry-url: 'https://npm.pkg.github.com'
          # Defaults to the user or organization that owns the workflow file
          scope: '@bogegit'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Update package version from tag
        run: |
          # GITHUB_REF_NAME contains the tag name, e.g., "v2.0.8"
          # Remove the 'v' prefix
          VERSION=${GITHUB_REF_NAME#v}
          echo "Setting package version to $VERSION"
          npm version $VERSION --no-git-tag-version --allow-same-version

      # pnpm publish executes pre-publish scripts like build if they exist,
      # but here we run pack first to match previous workflow
      - name: Build project
        run: pnpm run build

      - name: Publish package
        run: |
          # GITHUB_REF_NAME contains the tag name, e.g., "v2.0.8-beta.0"
          # Remove the 'v' prefix
          VERSION=${GITHUB_REF_NAME#v}
          
          # Check if the version is a pre-release (contains '-')
          if [[ "$VERSION" == *"-"* ]]; then
            echo "Pre-release version detected: $VERSION. Publishing with 'beta' tag..."
            pnpm publish --tag beta --no-git-checks
          else
            echo "Stable version detected: $VERSION. Publishing with 'latest' tag..."
            pnpm publish --no-git-checks
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Archive build artifacts
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "Packaging npm tarball..."
          pnpm pack --pack-destination .
          mv boge-mvp-game-lib-*.tgz "game-lib-${VERSION}.tgz"

          echo "Creating ZIP archive of build artifacts..."
          FILES_TO_ZIP=(
            bin dist assets webp lib
            index.js package.json
            types.js reserved.js typescript-parse.js
            rollup-plugin-rename.js rollup-plugin-decorators.js rollup-plugin-generics.js
          )
          if [ -f "README.md" ]; then FILES_TO_ZIP+=(README.md); fi
          if [ -f "version_info.txt" ]; then FILES_TO_ZIP+=(version_info.txt); fi
          zip -r "game-lib-${VERSION}.zip" "${FILES_TO_ZIP[@]}"

      - name: Create GitHub Release and upload assets
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          EXTRA_ARGS=()
          if [[ "$VERSION" == *"-"* ]]; then
            EXTRA_ARGS+=(--prerelease)
          fi

          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists, uploading assets..."
            gh release upload "$GITHUB_REF_NAME" "game-lib-${VERSION}.zip" "game-lib-${VERSION}.tgz" --clobber
          else
            echo "Creating release $GITHUB_REF_NAME..."
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              "${EXTRA_ARGS[@]}" \
              "game-lib-${VERSION}.zip" \
              "game-lib-${VERSION}.tgz"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


